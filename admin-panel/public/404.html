<!-- public/404.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Get the current URL path
    const path = window.location.pathname;
    
    // Check if we have a duplicate base path
    if (path.includes('/The-Daily-Catch/The-Daily-Catch/')) {
      // Remove the duplicate and redirect
      const fixedPath = path.replace('/The-Daily-Catch/The-Daily-Catch/', '/The-Daily-Catch/');
      window.location.href = window.location.origin + fixedPath + window.location.search + window.location.hash;
    } else {
      // Regular 404 handling - redirect to home
      window.location.href = window.location.origin + '/The-Daily-Catch/';
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
