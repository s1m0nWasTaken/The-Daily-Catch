<!-- public/404.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    if (!path.includes('/The-Daily-Catch/')) {
      // Redirect to the repo path
      window.location.href = 
        window.location.origin + 
        '/The-Daily-Catch' + 
        (path === '/' ? '/login' : path) + 
        search + 
        hash;
    } else {
      // For other 404s, redirect to login
      window.location.href = window.location.origin + '/The-Daily-Catch/login';
    }
  </script>
</head>
<body>
  <p>Redirecting to application...</p>
</body>
</html>
